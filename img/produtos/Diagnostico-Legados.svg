  <circle cx="85" cy="72" r="6" fill="#ff5f57"/>
  <circle cx="108" cy="72" r="6" fill="#ffbd2e"/>
  <circle cx="131" cy="72" r="6" fill="#28c840"/>
  <!-- Code lines -->
  <text x="80" y="105" fill="#777" font-family="monospace" font-size="12">1</text>
