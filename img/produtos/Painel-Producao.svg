<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9cc41"/>
      <stop offset="100%" style="stop-color:#e6a800"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#2ecc71"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid lines -->
  <line x1="80" y1="60" x2="80" y2="400" stroke="#2a2a4a" stroke-width="1"/>
  <line x1="80" y1="400" x2="720" y2="400" stroke="#2a2a4a" stroke-width="1"/>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#1e1e3a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="240" x2="720" y2="240" stroke="#1e1e3a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="160" x2="720" y2="160" stroke="#1e1e3a" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Bars -->
  <rect x="120" y="280" width="50" height="120" rx="3" fill="url(#bar)">
    <animate attributeName="height" from="0" to="120" dur="0.8s" fill="freeze"/>
    <animate attributeName="y" from="400" to="280" dur="0.8s" fill="freeze"/>
  </rect>
  <rect x="200" y="220" width="50" height="180" rx="3" fill="url(#bar2)">
    <animate attributeName="height" from="0" to="180" dur="1s" fill="freeze"/>
    <animate attributeName="y" from="400" to="220" dur="1s" fill="freeze"/>
  </rect>
  <rect x="280" y="150" width="50" height="250" rx="3" fill="url(#bar)">
    <animate attributeName="height" from="0" to="250" dur="1.2s" fill="freeze"/>
    <animate attributeName="y" from="400" to="150" dur="1.2s" fill="freeze"/>
  </rect>
  <rect x="360" y="100" width="50" height="300" rx="3" fill="url(#bar2)">
    <animate attributeName="height" from="0" to="300" dur="1s" fill="freeze"/>
    <animate attributeName="y" from="400" to="100" dur="1s" fill="freeze"/>
  </rect>
  <rect x="440" y="190" width="50" height="210" rx="3" fill="url(#bar3)">
    <animate attributeName="height" from="0" to="210" dur="0.9s" fill="freeze"/>
    <animate attributeName="y" from="400" to="190" dur="0.9s" fill="freeze"/>
  </rect>
  <rect x="520" y="250" width="50" height="150" rx="3" fill="url(#bar)">
    <animate attributeName="height" from="0" to="150" dur="0.7s" fill="freeze"/>
    <animate attributeName="y" from="400" to="250" dur="0.7s" fill="freeze"/>
  </rect>
  <rect x="600" y="160" width="50" height="240" rx="3" fill="url(#bar3)">
    <animate attributeName="height" from="0" to="240" dur="1.1s" fill="freeze"/>
    <animate attributeName="y" from="400" to="160" dur="1.1s" fill="freeze"/>
  </rect>
  <!-- Pie chart -->
  <circle cx="680" cy="100" r="35" fill="none" stroke="#2a2a4a" stroke-width="1"/>
  <path d="M680 65 A35 35 0 0 1 710 85" fill="none" stroke="#f9cc41" stroke-width="8" stroke-linecap="round"/>
  <path d="M710 85 A35 35 0 0 1 660 120" fill="none" stroke="#4ecdc4" stroke-width="8" stroke-linecap="round"/>
  <path d="M660 120 A35 35 0 0 1 645 100" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round"/>
  <!-- KPI Cards -->
  <rect x="90" y="420" width="140" height="55" rx="6" fill="#1e1e3a" stroke="#f9cc41" stroke-width="1"/>
  <text x="160" y="444" text-anchor="middle" fill="#f9cc41" font-family="Arial,sans-serif" font-size="12" font-weight="bold">EFICIÊNCIA</text>
  <text x="160" y="464" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">94.2%</text>
  <rect x="250" y="420" width="140" height="55" rx="6" fill="#1e1e3a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="320" y="444" text-anchor="middle" fill="#4ecdc4" font-family="Arial,sans-serif" font-size="12" font-weight="bold">PRODUÇÃO</text>
  <text x="320" y="464" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">12,847 un</text>
  <rect x="410" y="420" width="140" height="55" rx="6" fill="#1e1e3a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="480" y="444" text-anchor="middle" fill="#ff6b6b" font-family="Arial,sans-serif" font-size="12" font-weight="bold">PARADAS</text>
  <text x="480" y="464" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="bold">43 min</text>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#f9cc41" font-family="Arial,sans-serif" font-size="16" font-weight="bold">PAINEL DE PRODUÇÃO</text>
  <text x="400" y="52" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="11">Indicadores Industriais em Tempo Real</text>
</svg>